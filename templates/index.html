<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ My Sweetski ✨</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="diary-container">
        <div class="diary-cover">
            <div class="diary-title">
                <h1>✨ Sweetski ✨</h1>
                <p class="subtitle">Python-Powered Dessert Adventure Through Japan</p>
            </div>
            
            <div class="diary-content">
                <div class="new-entry-section">
                    <h2>📝 Write a New Entry</h2>
                    <form id="newEntryForm" class="entry-form">
                        <div class="form-group">
                            <label for="entryLink">Link/URL:</label>
                            <input type="url" id="entryLink" name="title" placeholder="https://example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="entryNotes">Your notes:</label>
                            <textarea id="entryNotes" name="content" placeholder="That kakigori was so good!" rows="6" required></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Save to Notion</button>
                    </form>
                </div>

                <div class="entries-section">
                    <h2>📖 Previous Entries</h2>
                    <div id="entriesList" class="entries-list">
                        <div class="loading">Loading your diary entries...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
